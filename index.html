<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Co-Lab Vendor Support</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css"/>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f4f4f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .chat-container {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.10);
      width: 100%;
      max-width: 680px;
      display: flex;
      flex-direction: column;
      height: 90vh;
      max-height: 780px;
      overflow: hidden;
    }
    .header {
      background: #1a1a1a;
      color: #fff;
      padding: 1rem 1.25rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      border-radius: 16px 16px 0 0;
    }
    .header-logo {
      width: 36px; height: 36px;
      background: #e8ff47;
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.1rem;
    }
    .header-text h2 { font-size: 1rem; font-weight: 600; }
    .header-text p { font-size: 0.75rem; color: #aaa; margin-top: 1px; }
    .status { display: flex; align-items: center; gap: 0.4rem; margin-left: auto; font-size: 0.75rem; color: #aaa; }
    .dot { width: 8px; height: 8px; background: #4ade80; border-radius: 50%; }
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .msg { display: flex; gap: 0.6rem; align-items: flex-end; }
    .msg.user { flex-direction: row-reverse; }
    .msg-avatar {
      width: 30px; height: 30px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.8rem; flex-shrink: 0;
    }
    .msg-avatar.bot { background: #1a1a1a; color: #e8ff47; }
    .msg-avatar.user { background: #e8ff47; color: #1a1a1a; }
    .bubble {
      max-width: 75%;
      padding: 0.65rem 0.9rem;
      border-radius: 14px;
      font-size: 0.88rem;
      line-height: 1.5;
    }
    .bubble.bot { background: #f4f4f0; color: #1a1a1a; border-bottom-left-radius: 4px; }
    .bubble.user { background: #1a1a1a; color: #fff; border-bottom-right-radius: 4px; }
    .bubble.typing { color: #999; font-style: italic; }
    .quick-btns {
      padding: 0 1.25rem 0.75rem;
      display: flex; flex-wrap: wrap; gap: 0.4rem;
    }
    .quick-btns button {
      background: #f4f4f0; border: none; border-radius: 20px;
      padding: 0.4rem 0.8rem; font-size: 0.78rem; cursor: pointer;
      color: #333; transition: background 0.15s;
    }
    .quick-btns button:hover { background: #e8ff47; color: #1a1a1a; }
    .input-row {
      padding: 0.75rem 1.25rem 1rem;
      display: flex; gap: 0.5rem; align-items: flex-end;
      border-top: 1px solid #f0f0f0;
    }
    #userinput {
      flex: 1; border: 1.5px solid #e0e0e0; border-radius: 12px;
      padding: 0.6rem 0.85rem; font-size: 0.88rem;
      resize: none; font-family: inherit; outline: none;
      transition: border-color 0.15s; max-height: 120px;
    }
    #userinput:focus { border-color: #1a1a1a; }
    #sendbtn {
      background: #1a1a1a; color: #e8ff47; border: none;
      border-radius: 12px; padding: 0.6rem 1.1rem;
      font-size: 0.88rem; font-weight: 600; cursor: pointer;
      display: flex; align-items: center; gap: 0.35rem;
      transition: opacity 0.15s;
    }
    #sendbtn:disabled { opacity: 0.4; cursor: default; }
    #sendbtn:hover:not(:disabled) { opacity: 0.85; }
    .footer-note {
      text-align: center; font-size: 0.74rem; color: #aaa;
      padding: 0 1.25rem 0.85rem;
    }
    .footer-note a { color: #666; }
  </style>
</head>
<body>
<div class="chat-container">
  <div class="header">
    <div class="header-logo">🏪</div>
    <div class="header-text">
      <h2>Co-Lab Support</h2>
      <p>Vendor permit assistance</p>
    </div>
    <div class="status">
      <div class="dot"></div>
      <span>Online</span>
    </div>
  </div>

  <div class="messages" id="messages"></div>

  <div class="quick-btns">
    <button onclick="sendQuick('How do I get insurance?')">🛡️ Insurance</button>
    <button onclick="sendQuick('When should I start food manager training?')">🎓 Training</button>
    <button onclick="sendQuick('What are the steps to get onboarded?')">📋 Onboarding</button>
    <button onclick="sendQuick('What are the fees and monthly rates?')">💰 Fees & rates</button>
    <button onclick="sendQuick('What equipment can I rent at Co-Lab?')">🔧 Equipment</button>
    <button onclick="sendQuick('Tell me about storage options')">📦 Storage</button>
    <button onclick="sendQuick('What are the kitchen hours and best days to book?')">🕐 Hours & booking</button>
  </div>

  <div class="input-row">
    <textarea id="userinput" rows="1" placeholder="Type your question…"
      onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMsg();}"></textarea>
    <button id="sendbtn" onclick="sendMsg()">
      Send <i class="ti ti-send"></i>
    </button>
  </div>

  <div class="footer-note">
    Can't find your answer? <a href="mailto:youssef@co-lab.com">Email Youssef</a>
  </div>
</div>

<script>
  const sessionId = 'sess_' + Math.random().toString(36).slice(2, 10) + '_' + Date.now();
  const msgs = [];

  function addBubble(text, isUser) {
    const wrap = document.createElement('div');
    wrap.className = 'msg' + (isUser ? ' user' : '');
    const av = document.createElement('div');
    av.className = 'msg-avatar ' + (isUser ? 'user' : 'bot');
    av.innerHTML = isUser ? '<i class="ti ti-user"></i>' : '<i class="ti ti-building-store"></i>';
    const bubble = document.createElement('div');
    bubble.className = 'bubble ' + (isUser ? 'user' : 'bot');
    bubble.textContent = text;
    wrap.appendChild(av);
    wrap.appendChild(bubble);
    document.getElementById('messages').appendChild(wrap);
    wrap.scrollIntoView({ behavior: 'smooth', block: 'end' });
    return bubble;
  }

  addBubble("Hi! I'm the Co-Lab vendor support assistant. I can help with insurance, training, onboarding, fees, kitchen info, storage, and more. What do you need help with?", false);

  async function sendMsg() {
    const input = document.getElementById('userinput');
    const btn = document.getElementById('sendbtn');
    const text = input.value.trim();
    if (!text) return;
    input.value = '';
    btn.disabled = true;

    addBubble(text, true);
    msgs.push({ role: 'user', content: text });

    const thinking = addBubble('Typing…', false);
    thinking.classList.add('typing');

    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages: msgs, sessionId })
      });
      const data = await res.json();
      const reply = data.reply || "Sorry, I couldn't get a response. Please email youssef@co-lab.com.";
      thinking.textContent = reply;
      thinking.classList.remove('typing');
      msgs.push({ role: 'assistant', content: reply });
    } catch (e) {
      thinking.textContent = "Something went wrong. Please email youssef@co-lab.com for help.";
      thinking.classList.remove('typing');
    }

    btn.disabled = false;
    input.focus();
  }

  function sendQuick(q) {
    document.getElementById('userinput').value = q;
    sendMsg();
  }
</script>
</body>
</html>
