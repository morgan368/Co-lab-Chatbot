<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Co-Lab Vendor Support</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css"/>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f4f4f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .container {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      width: 100%;
      max-width: 640px;
      display: flex;
      flex-direction: column;
      height: 90vh;
      max-height: 760px;
      overflow: hidden;
    }

    .header {
      padding: 16px 20px;
      border-bottom: 1px solid #f0f0f0;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }
    .header .avatar {
      width: 40px; height: 40px; border-radius: 50%;
      background: #e6f1fb;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .header .avatar i { font-size: 20px; color: #185fa5; }
    .header .info h2 { font-size: 15px; font-weight: 600; color: #1a1a1a; }
    .header .info p { font-size: 13px; color: #888; }
    .header .status { margin-left: auto; display: flex; align-items: center; gap: 6px; }
    .header .status .dot { width: 8px; height: 8px; border-radius: 50%; background: #3B6D11; }
    .header .status span { font-size: 12px; color: #888; }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .msg { display: flex; gap: 10px; align-items: flex-end; }
    .msg.user { flex-direction: row-reverse; }

    .msg-avatar {
      width: 28px; height: 28px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .msg-avatar.bot { background: #e6f1fb; }
    .msg-avatar.bot i { font-size: 14px; color: #185fa5; }
    .msg-avatar.user { background: #f0f0f0; border: 1px solid #e5e5e5; }
    .msg-avatar.user i { font-size: 14px; color: #888; }

    .bubble {
      max-width: 78%; padding: 10px 14px;
      font-size: 14px; line-height: 1.6;
      white-space: pre-wrap; word-break: break-word;
    }
    .bubble.bot {
      background: #f7f7f5; border: 1px solid #ebebeb;
      border-radius: 4px 14px 14px 14px; color: #1a1a1a;
    }
    .bubble.user {
      background: #e6f1fb; border: 1px solid #b5d4f4;
      border-radius: 14px 4px 14px 14px; color: #0c447c;
    }
    .bubble.typing { color: #aaa; font-style: italic; }

    .quick-btns {
      padding: 0 20px 12px;
      display: flex; flex-wrap: wrap; gap: 8px;
      flex-shrink: 0;
    }
    .quick-btns button {
      font-size: 12px; padding: 6px 12px;
      border-radius: 20px; border: 1px solid #ddd;
      background: #fff; color: #444;
      cursor: pointer; transition: background 0.15s;
    }
    .quick-btns button:hover { background: #f0f0f0; }

    .input-row {
      padding: 12px 20px 16px;
      border-top: 1px solid #f0f0f0;
      display: flex; gap: 8px; align-items: flex-end;
      flex-shrink: 0;
    }
    .input-row textarea {
      flex: 1; resize: none; font-size: 14px;
      padding: 10px 12px; border: 1px solid #ddd;
      border-radius: 12px; font-family: inherit;
      line-height: 1.5; outline: none; max-height: 120px;
    }
    .input-row textarea:focus { border-color: #185fa5; }
    .input-row button {
      height: 44px; padding: 0 16px;
      background: #185fa5; color: #fff;
      border: none; border-radius: 12px;
      cursor: pointer; display: flex;
      align-items: center; gap: 6px;
      font-size: 14px; flex-shrink: 0;
    }
    .input-row button:hover { background: #0c447c; }
    .input-row button:disabled { background: #aaa; cursor: not-allowed; }

    .footer-note {
      text-align: center; font-size: 11px;
      color: #aaa; padding-bottom: 12px; flex-shrink: 0;
    }
    .footer-note a { color: #185fa5; }
  </style>
</head>
<body>
<div class="container">

  <div class="header">
    <div class="avatar"><i class="ti ti-building-store"></i></div>
    <div class="info">
      <h2>Co-Lab Vendor Support</h2>
      <p>Ask about onboarding, fees, insurance, training & more</p>
    </div>
    <div class="status">
      <div class="dot"></div>
      <span>Online</span>
    </div>
  </div>

  <div class="messages" id="messages"></div>

  <div class="quick-btns">
    <button onclick="sendQuick('How do I get insurance?')">🛡️ Insurance</button>
    <button onclick="sendQuick('When should I start food manager training?')">🎓 Training</button>
    <button onclick="sendQuick('What is the difference between onboarding and the TFF permit?')">📋 Onboarding vs TFF</button>
    <button onclick="sendQuick('What are the fees and monthly rates?')">💰 Fees & rates</button>
    <button onclick="sendQuick('What equipment can I rent at Co-Lab?')">🔧 Equipment</button>
    <button onclick="sendQuick('Tell me about storage options')">📦 Storage</button>
    <button onclick="sendQuick('What are the kitchen hours and best days to book?')">🕐 Hours & booking</button>
  </div>

  <div class="input-row">
    <textarea id="userinput" rows="1" placeholder="Type your question…"
      onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMsg();}"></textarea>
    <button id="sendbtn" onclick="sendMsg()">
      Send <i class="ti ti-send"></i>
    </button>
  </div>

  <div class="footer-note">
    Can't find your answer? <a href="mailto:youssef@co-lab.com">Email Youssef</a>
  </div>

</div>

<script>
const msgs = [];

function addBubble(text, isUser) {
  const wrap = document.createElement('div');
  wrap.className = 'msg' + (isUser ? ' user' : '');

  const av = document.createElement('div');
  av.className = 'msg-avatar ' + (isUser ? 'user' : 'bot');
  av.innerHTML = isUser
    ? '<i class="ti ti-user"></i>'
    : '<i class="ti ti-building-store"></i>';

  const bubble = document.createElement('div');
  bubble.className = 'bubble ' + (isUser ? 'user' : 'bot');
  bubble.textContent = text;

  wrap.appendChild(av);
  wrap.appendChild(bubble);
  document.getElementById('messages').appendChild(wrap);
  wrap.scrollIntoView({ behavior: 'smooth', block: 'end' });
  return bubble;
}

addBubble("Hi! I'm the Co-Lab vendor support assistant. I can help with insurance, training, onboarding, fees, kitchen info, storage, and more. What do you need help with?", false);

async function sendMsg() {
  const input = document.getElementById('userinput');
  const btn = document.getElementById('sendbtn');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  btn.disabled = true;

  addBubble(text, true);
  msgs.push({ role: 'user', content: text });

  const thinking = addBubble('Typing…', false);
  thinking.classList.add('typing');

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: msgs })
    });
    const data = await res.json();
    const reply = data.reply
      || "Sorry, I couldn't get a response. Please email youssef@co-lab.com.";
    thinking.textContent = reply;
    thinking.classList.remove('typing');
    msgs.push({ role: 'assistant', content: reply });
  } catch (e) {
    thinking.textContent = "Something went wrong. Please email youssef@co-lab.com for help.";
    thinking.classList.remove('typing');
  }

  btn.disabled = false;
  input.focus();
}

function sendQuick(q) {
  document.getElementById('userinput').value = q;
  sendMsg();
}
</script>
</body>
</html>
